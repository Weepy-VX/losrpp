eHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"700"}],"display-hero-mobile":["36px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"800"}],"headline-lg-mobile":["26px",{"lineHeight":"32px","letterSpacing":"-0.01em","fontWeight":"700"}],"body-lg":["16px",{"lineHeight":"26px","letterSpacing":"0em","fontWeight":"400"}],"label-tactical":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"600"}],"display-hero":["56px",{"lineHeight":"64px","letterSpacing":"-0.03em","fontWeight":"800"}],"body-md":["14px",{"lineHeight":"22px","letterSpacing":"0em","fontWeight":"400"}],"label-caps":["11px",{"lineHeight":"16px","letterSpacing":"0.08em","fontWeight":"700"}],"headline-sm":["18px",{"lineHeight":"24px","letterSpacing":"0em","fontWeight":"600"}]}}}};
  </script>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased">
  <main class="w-full min-h-screen bg-surface flex items-center justify-center">
    <div class="flex flex-col w-full relative min-h-screen items-center justify-center p-4 sm:p-6 overflow-hidden">
      <div class="absolute inset-0 z-0">
        <div class="w-full h-full bg-cover bg-center scale-105 filter brightness-75 contrast-125" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDv3awt_7ervswSiSNCDe9YB7CCIpnWZ0P-1gCaj8EFwmYWXLNY3RR-xyKddMh98wGKOvOURVIixc9E7TU821BEleswjW0vKTD3WnY2NQcYJ20kZcowovdllEXqoc2wj2yHfYO2CmQaia3cxPBwNtWN6Q_xy8ySKsI5rl1Czy5kIwSXuXUS71KXn7WnXHAkbMQzGOQdGlaLxu7L9yRGnIFdJsJOyy01cJTO0NPfIYYimi9ICygTR_2O50N1BlFi5boq');"></div>
        <div class="absolute inset-0 bg-surface-container-lowest/80 backdrop-blur-xl"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-transparent to-surface-container-lowest/60"></div>
      </div>

      <div class="relative z-10 w-full max-w-lg mx-auto bg-surface-container-low/95 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-2xl">
        <div class="flex items-center justify-between border-b border-surface-container-high/60 pb-5 mb-6">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-surface-container-lowest flex items-center justify-center p-1.5 border border-surface-container-high">
              <img alt="Los Angeles Roleplay" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDq5PjVd3OyVPNV7OarGbPeve4Dr586NPpa_i-jehPw3OXyG4twBYw5xUEFpHhuhdA1XHogJtpgUgecl2yGIVjLd_8MW4Fj1WJPA269kyj_deHm6uyg6zw8arkQGDLdgT00nUpmd5xxD0qzIeib2sTINm0zOMH9sSynR_h5gBI2ZkvCyriy5h20eRVOI1gMBc26H3MmhpQjGfvX6m_2dfDiC5BTuoSBBdQmdZcdZ2HgxVa9cL1ID91GZlH5nj7xPtIS"/>
            </div>
            <div class="flex flex-col">
              <span class="font-semibold text-sm text-on-surface tracking-wide">Los Angeles Roleplay</span>
              <span class="text-xs text-secondary/70">Gateway Portal</span>
            </div>
          </div>
          <div class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-surface-container-high/80 text-secondary text-xs">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span class="text-[11px] font-medium text-on-surface">Secure Node</span>
          </div>
        </div>

        <div class="flex flex-col items-center justify-center text-center pb-6">
          <div id="icon-bg" class="w-20 h-20 rounded-2xl bg-surface-container-high flex items-center justify-center shadow-md mb-4 transition-colors duration-300">
            <span id="dynamic-icon" class="material-symbols-outlined text-4xl text-white">link</span>
          </div>
          <h1 id="dynamic-title" class="text-xl font-bold tracking-tight text-on-surface mb-2">Establishing Connection</h1>
          <p id="dynamic-subtitle" class="font-body-md text-secondary text-sm max-w-sm">
            Routing your request to the designated external server.
          </p>
        </div>

        <div class="w-full bg-surface-container-lowest border border-surface-container-high/60 rounded-xl p-2.5 flex items-center justify-between mb-4">
          <div class="flex items-center space-x-2 overflow-hidden px-1.5">
            <span class="material-symbols-outlined text-secondary text-base shrink-0 select-none">link</span>
            <span class="font-mono text-xs sm:text-sm text-secondary truncate selection:bg-primary-container selection:text-black" id="target-url">Loading...</span>
          </div>
          <button id="copy-btn" class="flex items-center space-x-1.5 shrink-0 px-3 py-1.5 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface transition-colors text-xs font-medium cursor-pointer" title="Copy link">
            <span class="material-symbols-outlined text-sm">content_copy</span>
            <span class="hidden sm:inline">Copy</span>
          </button>
        </div>

        <div class="opacity-0 transition-opacity duration-200 text-center text-xs text-secondary -mt-2 mb-3" id="copied-tip">
          Link copied to clipboard!
        </div>

        <div class="flex flex-col space-y-2.5">
          <a id="continue-btn" class="w-full bg-primary-container text-black py-3.5 px-6 rounded-xl font-semibold text-center text-sm flex items-center justify-center space-x-2 hover:brightness-105 active:scale-[0.99] transition-all cursor-pointer" href="#" rel="noopener noreferrer" target="_blank">
            <span id="btn-text">Proceed Manually</span>
            <span class="material-symbols-outlined text-base font-bold">arrow_forward</span>
          </a>
          <button class="w-full py-2.5 rounded-xl font-medium text-xs text-secondary hover:text-on-surface transition-colors text-center cursor-pointer" onclick="window.history.back()">
            Abort & Return to Index
          </button>
        </div>

        <div class="mt-6 pt-4 border-t border-surface-container-high/40 flex items-center justify-center space-x-2 text-xs text-secondary/70">
          <span class="material-symbols-outlined text-sm text-emerald-400" style="font-variation-settings: 'FILL' 1;">verified</span>
          <span>Verified destination • <span id="footnote-url" class="text-on-surface font-medium">...</span></span>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const targetUrl = params.get('url') || 'https://discord.gg/C9rw3W6sJ3';
        const title = params.get('title') || 'External Link';
        const targetType = params.get('target') || 'link';

        // Apply text fields
        document.getElementById('dynamic-title').textContent = title.replace(/\+/g, ' ');
        document.getElementById('target-url').textContent = targetUrl;
        document.getElementById('footnote-url').textContent = targetUrl.replace(/^https?:\/\//, '');
        document.getElementById('continue-btn').href = targetUrl;

        // Dynamic styling based on target payload
        const iconBg = document.getElementById('icon-bg');
        const iconEl = document.getElementById('dynamic-icon');
        const subtitle = document.getElementById('dynamic-subtitle');

        if (targetType === 'discord') {
          iconBg.className = 'w-20 h-20 rounded-2xl bg-[#5865F2] flex items-center justify-center shadow-md mb-4';
          iconEl.textContent = 'forum';
          subtitle.textContent = 'You are being redirected to the official community Discord server.';
        } else if (targetType === 'game') {
          iconBg.className = 'w-20 h-20 rounded-2xl bg-primary-container flex items-center justify-center shadow-md mb-4';
          iconEl.className = 'material-symbols-outlined text-4xl text-black';
          iconEl.textContent = 'sports_esports';
          subtitle.textContent = 'Initializing connection to the main roleplay server via ERLC.';
        } else if (targetType === 'cad') {
          iconBg.className = 'w-20 h-20 rounded-2xl bg-red-600 flex items-center justify-center shadow-md mb-4';
          iconEl.textContent = 'shield';
          subtitle.textContent = 'Accessing secure terminal dispatch protocols.';
        }

        // Copy functionality
        document.getElementById('copy-btn').onclick = function() {
          navigator.clipboard.writeText(targetUrl);
          const tip = document.getElementById('copied-tip');
          tip.classList.remove('opacity-0');
          setTimeout(() => tip.classList.add('opacity-0'), 2000);
        };

        // Automated countdown & redirect
        let countdownSeconds = 5;
        const btnText = document.getElementById('btn-text');
        
        const interval = setInterval(() => {
          countdownSeconds--;
          if(countdownSeconds <= 0) {
            clearInterval(interval);
            btnText.textContent = 'Connecting...';
            window.location.href = targetUrl;
          } else {
            btnText.textContent = `Proceeding in ${countdownSeconds}s`;
          }
        }, 1000);
      });
    </script>
  </main>
</body>
</html>
